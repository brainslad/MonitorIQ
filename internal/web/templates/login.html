{{template "head" .}}
<body class="center-page">
<div class="card login">
  <div class="brand big{{if .Brand.Logo}} custom{{end}}">{{template "brand-mark" .Brand}}</div>
  {{if .Flash}}<div class="flash err">{{.Flash}}</div>{{end}}
  {{if .Data.SSO}}
  <a class="btn primary wide sso" href="{{.Data.SSOURL}}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>{{.Data.SSOLabel}}</a>
  {{if .Data.ShowLocal}}<div class="divider"><span>or</span></div>{{end}}
  {{end}}
  {{if .Data.ShowLocal}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Username<input name="username" autocomplete="username" required {{if not .Data.SSO}}autofocus{{end}} value="{{.Data.Username}}"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn {{if .Data.SSO}}{{else}}primary{{end}} wide" type="submit">Sign in{{if .Data.LDAP}} <span class="muted small">(local or directory account)</span>{{end}}</button>
  </form>
  {{else}}
  <p class="muted small center"><a href="/login?local=1&amp;next={{.Data.Next}}">Sign in with a local account</a></p>
  {{end}}
</div>
{{template "footer" .}}
<script src="/static/app.js"></script>
</body>
</html>
