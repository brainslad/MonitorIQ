# Exemplo de reverse proxy nginx com HTTPS para o MonitorIQ.
# 1. dnf install -y nginx certbot python3-certbot-nginx
# 2. Copie este ficheiro para /etc/nginx/conf.d/monitoriq.conf e altere server_name
# 3. setsebool -P httpd_can_network_connect 1     (SELinux: permite ao nginx ligar ao MonitorIQ)
# 4. Em /etc/monitoriq/monitoriq.env: MONITORIQ_LISTEN=127.0.0.1:8080, MONITORIQ_TRUST_PROXY=true,
#    MONITORIQ_BASE_URL=https://status.exemplo.pt  e  systemctl restart monitoriq
# 5. systemctl enable --now nginx && certbot --nginx -d status.exemplo.pt
# 6. firewall-cmd --permanent --add-service=http --add-service=https && firewall-cmd --reload

server {
    listen 80;
    listen [::]:80;
    server_name status.exemplo.pt;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
