name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Start a test OpenLDAP server
        run: |
          docker run -d --name ldap -p 389:389 -e LDAP_DOMAIN=example.org -e LDAP_ADMIN_PASSWORD=adminpw -e LDAP_TLS=false osixia/openldap:1.5.0
          for i in $(seq 30); do docker exec ldap ldapsearch -x -H ldap://localhost -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w adminpw >/dev/null 2>&1 && break; sleep 1; done
          docker exec -i ldap ldapadd -x -H ldap://localhost -D cn=admin,dc=example,dc=org -w adminpw < internal/auth/testdata/seed.ldif
      - run: go test -race ./...
        env:
          MIQ_LDAP_URL: ldap://127.0.0.1:389
      - run: make build
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh
